<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ Sơ Cá Nhân - Nguyễn Hoàng Hiệp</title>
    <style>
        /* Tùy chỉnh màu sắc và phông chữ toàn trang */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Khung Profile chính */
        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
        }

        /* Ảnh đại diện */
        .avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #2a5298;
            margin-bottom: 15px;
        }

        /* Tên & Chức danh */
        .name { KĨ Sư phần mềm
            font-size: 26px;
            color: #333333;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .job-title {
            font-size: 14px;
            color: #2a5298;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
        }

        /* Lời giới thiệu */
        .bio {không
            font-size: 15px;
            color: #555555;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* Phần Kỹ năng / Điểm mạnh */
        .skills-title {năng nổ ,tư duy tốt
            font-size: 16px;
            color: #333;
            margin-bottom: 12px;
            font-weight: bold;
            text-align: left;
        }

        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 25px;
        }

        .skill-tag {
            background: #eef2f7;
            color: #2a5298;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        /* Nút bấm liên hệ */
        .contact-btn {0966877684
            display: block;
            width: 100%;
            padding: 12px;
            background: #2a5298;
            color: #ffffff;
            text-decoration: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            transition: 0.3s;
        }

        .contact-btn:hover {
            background: #1e3c72;
        }
    </style>
</head>

</html>
